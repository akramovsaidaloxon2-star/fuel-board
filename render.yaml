services:
  - type: web
    name: fuel-board
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: MOTIVE_API_KEY
        sync: false
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Toll directions: dispatch sheet intake + confirm-or-nag reminders
      - key: TOLL_SHEET_CSV
        sync: false
      - key: REMIND_EVERY_MIN
        value: "30"
      - key: SHEET_POLL_MIN
        value: "3"
